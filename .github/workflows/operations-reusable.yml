name: Operations Reusable

on:
  workflow_call:
    inputs:
      project:
        required: true
        type: string
        description: "Project name"
      environment:
        required: true
        type: string
        description: "Environment name [dev|pre]"
      operation:
        required: true
        type: string

jobs:
  run_operation:
    name: ${{ inputs.project }} ${{ inputs.enviroment }}
    runs-on: self-hosted
    environment: ${{ inputs.environment == 'dev' && 'certification' || 'preproduction' }}
    
    steps:

      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Resolve project variables
        id: vars
        shell: bash
        run: |
          PROJECT_UP=$(printf '%s' "${{ inputs.projects }}" | tr '[:lower:]' '[:upper:]')
          ENV_UP=$(printf '%s' "${{ inputs.environment }}" | tr '[:lower:]' '[:upper:]')
          echo "project_up=$PROJECT_UP" >> "$GITHUB_OUTPUT"
          echo "env_up=$ENV_UP" >> "$GITHUB_OUTPUT"
          echo "label=$PROJECT_UP $ENV_UP" >> "$GITHUB_OUTPUT"

      - name: AWS Login Project Account
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-oidc-${{ inputs.environment }}

      - name: Verify AWS identity
        run: |
          echo "GitHub Environment: ${{ inputs.environment }}"
          aws sts get-caller-identity          

      - name: Turn ${{ inputs.operation }} ${{ inputs.project }} ${{ inputs.environment }}
        id: call_turn_operation
        uses: pcorcobado/actions/actions/operations@v1
        with:
          operation: ${{ inputs.operation }}
          environment: ${{ inputs.environment }}
          project: ${{ inputs.project }}
